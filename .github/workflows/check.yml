# Checks the code on every push, on any branch: five independent jobs that
# start at the same time, written from the quickest to the slowest.
#
#   lint        lintr, in the style of .lintr (seconds)
#   static      the static check (engine/tests/static_check.R), for every
#               project folder (project_*/): the pipeline is
#               valid, every function called exists, and the code keeps to
#               the declared way (expensive calls replayable, files declared
#               as steps); inside the published image, for its packages,
#               after waiting for an image build still running
#               (ci/wait_for_image.sh)
#   links       every link in the README and the docs (seconds)
#   workflows   actionlint on these workflow files (seconds)
#   smoke       the smoke test (VALIDATION_SMOKE=1: Rscript run_all.R
#               <project> [studies], a corner of every study from scratch) of
#               what changed since the last passed Check run on the branch
#               (ci/smoke_selection.sh, ci/smoke_studies.R), inside the
#               published image, so with exactly the packages and CmdStan of
#               the real run (15-20 minutes a project); skipped when an image build
#               runs it, or ran it on the same code (see the smoke job). It fails
#               when the outputs check (engine/tests/check_results.R) finds a
#               missing file, an empty table, or NA/NaN/Inf. It runs
#               with 3 workers (16 cores pretended: (16 - 1) %/% 4), as a
#               real run has several: clashes between workers only show then
#
# On a public repository the runners are free. The run-time estimate
# (timing.yml) is separate and runs on demand only.
name: Check

on:
  push:
    branches: ["**"]   # every branch (not tags)
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Lint
        run: |
          install.packages("lintr")
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # the static check reads the packages in the image (flatcor's functions,
      # for one): when this push changed the environment, check against the
      # new image, not the one before it
      - name: Wait for an image build of this branch, if one is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/wait_for_image.sh
      - name: Static check
        run: |
          for project in project_*/; do
            docker run --rm -v "$PWD":/project -e PROJECT="${project%/}" \
              "ghcr.io/${{ github.repository_owner }}/flatcor-validation:$(cluster/image_tag.sh)" \
              Rscript engine/tests/static_check.R
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 403: publishers (such as Wiley) refuse automated requests to links
      # that work in a browser; temporary errors are retried. A file on
      # GitHub is checked as its raw file: GitHub's rendered page of a long
      # document (appendix A) can answer 503 to automated requests.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept '200..=299,403' --max-retries 3
            --remap 'https://github.com/([^/]+)/([^/]+)/blob/(.*) https://raw.githubusercontent.com/$1/$2/$3'
            README.md 'engine/**/*.md' 'project_*/**/*.md' cluster/README.md
          fail: true

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # The smoke test runs once per change: in the image build when there is
  # one, here when there is not.
  #  1. An image build for this very commit (the push changed the
  #     environment, or image.yml) smoke-tests it before publishing: this job
  #     stops at once and leaves the test, and any failure, to that build.
  #  2. Otherwise it waits for an image build of an earlier push still
  #     running, then reads from the image of this commit's environment the
  #     commit that image was smoke-tested on (its label
  #     org.opencontainers.image.revision). If the code is the same there and
  #     here, the test has run: it stops. "The code" is everything except the
  #     files the pipeline never reads: each project's docs/, every .md file, .github/,
  #     cluster/aws/, .lintr. So a push of only docs or
  #     workflows right after an image build is not tested twice, and any
  #     change to the pipeline's code is tested once.
  #  3. Otherwise it smoke-tests only what changed since the last commit on
  #     this branch that passed the Check workflow (ci/smoke_selection.sh):
  #     a changed study folder, project_X/studies/<code>_*/, runs that study
  #     and the studies that use its parts (ci/smoke_studies.R); any other
  #     changed file in project_X/ runs all of project X; a changed file
  #     outside project_*/ (engine/, _targets.R, run_all.R, renv.lock, ci/,
  #     cluster/) runs every project, and so does a branch with no passed
  #     Check run yet. The same files as in 2 never count.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/flatcor-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # to compare with earlier commits

      - name: Is an image build smoke-testing this commit?
        id: build
        run: |
          sleep 60   # an image build started by the same push takes a moment to show
          build=$(gh run list -R "$GITHUB_REPOSITORY" --workflow image.yml \
            --commit "$GITHUB_SHA" --limit 1 --json url -q '.[0].url // empty')
          if [ -n "$build" ]; then
            echo "The image build for this commit smoke-tests it: $build"
            echo "tested=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for an image build of an earlier push, if one is running
        if: steps.build.outputs.tested != 'true'
        run: ci/wait_for_image.sh 0

      - name: Was this code smoke-tested when its image was built?
        id: image
        if: steps.build.outputs.tested != 'true'
        run: |
          image="$IMAGE:$(cluster/image_tag.sh)"
          docker pull -q "$image"
          tested=$(docker inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "$image was smoke-tested on commit $tested"
          if git cat-file -e "$tested^{commit}" 2>/dev/null &&
            git diff --quiet "$tested" HEAD -- . ':!project_*/docs' ':!*.md' ':!.github' \
              ':!cluster/aws' ':!.lintr'; then
            echo "Same code here: the smoke test has run"
            echo "tested=true" >> "$GITHUB_OUTPUT"
          fi

      - name: What changed since the last passed Check run?
        if: steps.build.outputs.tested != 'true' && steps.image.outputs.tested != 'true'
        run: |
          ci/smoke_selection.sh > "$RUNNER_TEMP/selection"
          cat "$RUNNER_TEMP/selection"
          [ -s "$RUNNER_TEMP/selection" ] || echo "Nothing the pipeline reads changed"

      - name: Smoke test
        if: steps.build.outputs.tested != 'true' && steps.image.outputs.tested != 'true'
        run: |
          image="$IMAGE:$(cluster/image_tag.sh)"
          while read -r project studies; do
            if [ -n "$studies" ]; then
              # shellcheck disable=SC2086   # one word per study
              studies=$(docker run --rm -v "$PWD":/project "$image" \
                Rscript ci/smoke_studies.R "$project" $studies < /dev/null | tail -n 1)
            fi
            echo "Smoke test of $project: ${studies:-every study}"
            # shellcheck disable=SC2086
            docker run --rm -v "$PWD":/project \
              -e VALIDATION_SMOKE=1 -e R_PARALLELLY_AVAILABLECORES_SYSTEM=16 \
              "$image" Rscript run_all.R "$project" $studies < /dev/null
          done < "$RUNNER_TEMP/selection"
